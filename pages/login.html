<head>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="login-page">
  <div class="login-wrap">
    <div class="login-brand">
      <div class="login-brand-box">AC</div>
      <div>
        <div class="login-brand-name">AC Pneus</div>
        <div class="login-brand-sub">Painel do Dono</div>
      </div>
    </div>
    <div class="login-card">
      <div class="login-card-title">Bem-vindo 👋</div>
      <div class="login-card-sub">Faça login para acessar o painel</div>
      <label class="login-label">E-mail</label>
      <input id="email" class="login-input" type="email" placeholder="seu@email.com" autocomplete="email">
      <label class="login-label">Senha</label>
      <input id="senha" class="login-input" type="password" placeholder="••••••••" autocomplete="current-password">
      <button class="btn-login" id="btn-login" onclick="fazerLogin()">Entrar no painel</button>
      <div class="login-error" id="erro"></div>
    </div>
    <div class="login-footer">AC Pneus © 2025 — Acesso restrito</div>
  </div>
</div>

<script src="login.js"></script>

</body>
